name: Release

# Baut die portable Single-File-.exe.
#   * Manueller Start (Actions → Release → Run workflow): nur Download-Artefakt.
#   * Tag v* (z. B. v1.0.0): zusätzlich eine GitHub-Release-Seite mit .exe und
#     dem Mac-Werkzeug als Anhang – das ist der Link, den man weitergeben kann.
#
# WICHTIG: Diese .exe wird OHNE PIN gebaut. Das Geheimnis gehört nicht auf
# GitHub. Die geschützte Fassung entsteht lokal mit
#   build\publish.ps1 -Pin (Read-Host -AsSecureString "PIN")
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version für die Release-Seite, z. B. v1.0.0 (leer lassen = nur Artefakt bauen)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write        # nötig, um die Release-Seite anzulegen

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (Single-File, self-contained, win-x64)
        run: >
          dotnet publish src/DariaTech.PcDoctor/DariaTech.PcDoctor.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: DariaTech-PC-Doktor-win-x64
          path: publish/DariaTech.PcDoctor.exe
          if-no-files-found: error

      # --- Ab hier: fertige Release-Seite mit Downloads ---
      # Entweder durch einen Tag ausgelöst oder manuell mit angegebener Version.
      # Im zweiten Fall legt die GitHub-CLI den Tag selbst an – praktisch, wenn
      # sich lokal keine Tags pushen lassen.

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq 'tag') { "${{ github.ref_name }}" }
                 else { "${{ inputs.tag }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release=$([string]::IsNullOrWhiteSpace($tag) -eq $false)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release-Tag: '$tag'"

      - name: Mac-Werkzeug packen
        if: steps.ver.outputs.release == 'True'
        shell: pwsh
        run: Compress-Archive -Path mac/* -DestinationPath DariaTech-Mac-Doktor.zip

      - name: Prüfsummen erzeugen
        if: steps.ver.outputs.release == 'True'
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @('publish/DariaTech.PcDoctor.exe', 'DariaTech-Mac-Doktor.zip')) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash
            $lines += "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: Release-Seite anlegen
        if: steps.ver.outputs.release == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$env:TAG" `
            --target "$env:GITHUB_SHA" `
            --title "DariaTech PC-Doktor $env:TAG" `
            --notes-file RELEASE_NOTES.md `
            "publish/DariaTech.PcDoctor.exe#DariaTech-PC-Doktor.exe (Windows, portabel)" `
            "DariaTech-Mac-Doktor.zip#DariaTech Mac-Doktor (macOS)" `
            "SHA256SUMS.txt#Prüfsummen"
